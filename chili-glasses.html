<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,user-scalable=no"
>

<title>CHILI VISION // Glasses HUD</title>

<style>

* {
  box-sizing:border-box;
}

html,
body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;

  background:#020806;
  color:#00ff88;

  font-family:Consolas,Monaco,monospace;
}


/* =========================
   GRID
========================= */

.grid {
  position:fixed;
  inset:0;

  background-image:
    linear-gradient(
      rgba(0,255,136,.055) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0,255,136,.055) 1px,
      transparent 1px
    );

  background-size:40px 40px;

  pointer-events:none;
}


/* =========================
   HEADER
========================= */

.header {
  position:fixed;
  top:14px;
  left:18px;
}

.title {
  font-size:17px;
  font-weight:bold;
  letter-spacing:3px;
}

.subtitle {
  margin-top:3px;
  font-size:9px;
  color:#67a98a;
  letter-spacing:2px;
}

#status {
  position:fixed;

  top:15px;
  right:18px;

  padding:6px 10px;

  border:1px solid #00ff88;

  font-size:9px;
}


/* =========================
   CENTER RETICLE
========================= */

#reticle {
  position:fixed;

  left:50%;
  top:50%;

  width:70px;
  height:70px;

  margin-left:-35px;
  margin-top:-35px;

  border:1px solid rgba(0,255,136,.75);
  border-radius:50%;

  pointer-events:none;
}

#reticle::before,
#reticle::after {
  content:"";
  position:absolute;
  background:#00ff88;
}

#reticle::before {
  width:100px;
  height:1px;
  left:-16px;
  top:34px;
}

#reticle::after {
  height:100px;
  width:1px;
  top:-16px;
  left:34px;
}


/* =========================
   HEAD POINTER
========================= */

#pointer {
  position:fixed;

  left:50%;
  top:50%;

  width:22px;
  height:22px;

  margin-left:-11px;
  margin-top:-11px;

  border:2px solid #38dfff;
  border-radius:50%;

  box-shadow:
    0 0 15px #38dfff;

  z-index:100;

  pointer-events:none;
}

#pointer::after {
  content:"";

  position:absolute;

  width:4px;
  height:4px;

  left:7px;
  top:7px;

  background:#38dfff;

  border-radius:50%;
}


/* =========================
   HUD BUTTONS
========================= */

.hud-button {
  position:fixed;

  width:115px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(0,255,136,.65);

  background:
    rgba(0,20,12,.72);

  color:#00ff88;

  font-size:11px;
  font-weight:bold;

  letter-spacing:1px;

  transition:
    transform .15s,
    box-shadow .15s,
    background .15s;
}

.hud-button.targeted {
  border-color:#38dfff;
  color:#38dfff;

  box-shadow:
    0 0 18px rgba(56,223,255,.6);

  transform:scale(1.08);
}

.hud-button.activated {
  background:#00ff88;
  color:#00140a;
}


/* POSITIONS */

#scan {
  left:50%;
  top:15%;

  transform:
    translateX(-50%);
}

#menu {
  left:5%;
  top:46%;
}

#system {
  right:5%;
  top:46%;
}

#chiliAI {
  left:50%;
  bottom:13%;

  transform:
    translateX(-50%);
}


/* =========================
   DWELL BAR
========================= */

.progress {
  position:absolute;

  left:4px;
  right:4px;
  bottom:3px;

  height:3px;

  background:
    rgba(255,255,255,.1);
}

.progress-fill {
  width:0%;
  height:100%;

  background:#38dfff;
}


/* =========================
   TELEMETRY
========================= */

.telemetry {
  position:fixed;

  left:16px;
  bottom:15px;

  font-size:8px;
  color:#6ba589;

  line-height:1.6;
}

.telemetry strong {
  color:#00ff88;
}


/* =========================
   MESSAGE
========================= */

#messageBox {
  position:fixed;

  left:50%;
  top:67%;

  transform:
    translate(-50%,-50%);

  min-width:230px;

  padding:10px 14px;

  border:
    1px solid rgba(56,223,255,.4);

  background:
    rgba(0,15,10,.9);

  color:#38dfff;

  font-size:10px;

  text-align:center;

  opacity:0;

  transition:opacity .2s;

  pointer-events:none;
}

#messageBox.show {
  opacity:1;
}


/* =========================
   RECENTER
========================= */

#recenter {
  position:fixed;

  right:15px;
  bottom:15px;

  padding:8px 11px;

  border:1px solid #38dfff;

  background:
    rgba(56,223,255,.08);

  color:#38dfff;

  font-family:inherit;

  font-size:9px;

  z-index:200;
}


/* =========================
   START
========================= */

#start {
  position:fixed;
  inset:0;

  z-index:1000;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  background:#020806;
}

.start-title {
  font-size:34px;
  font-weight:bold;
  letter-spacing:5px;
}

.start-sub {
  margin-top:5px;
  margin-bottom:24px;

  color:#6ba589;

  font-size:10px;

  letter-spacing:2px;
}

#enable {
  padding:13px 23px;

  border:1px solid #00ff88;

  background:
    rgba(0,255,136,.08);

  color:#00ff88;

  font-family:inherit;

  font-weight:bold;
}

#startMessage {
  margin-top:14px;

  color:#6ba589;

  font-size:9px;

  max-width:300px;

  text-align:center;
}

</style>
</head>

<body>

<div class="grid"></div>


<div class="header">
  <div class="title">
    CHILI VISION
  </div>

  <div class="subtitle">
    RAY-BAN HUD // ALPHA
  </div>
</div>


<div id="status">
  HEAD OFFLINE
</div>


<div id="reticle"></div>

<div id="pointer"></div>


<!-- =====================
     INTERACTIVE TARGETS
===================== -->

<div
  id="scan"
  class="hud-button"
  data-action="scan"
>
  SCAN

  <div class="progress">
    <div class="progress-fill"></div>
  </div>
</div>


<div
  id="menu"
  class="hud-button"
  data-action="menu"
>
  MENU

  <div class="progress">
    <div class="progress-fill"></div>
  </div>
</div>


<div
  id="system"
  class="hud-button"
  data-action="system"
>
  STATUS

  <div class="progress">
    <div class="progress-fill"></div>
  </div>
</div>


<div
  id="chiliAI"
  class="hud-button"
  data-action="ai"
>
  CHILI AI

  <div class="progress">
    <div class="progress-fill"></div>
  </div>
</div>


<div id="messageBox">
  CHILI READY
</div>


<div class="telemetry">

  HEAD:
  <strong id="headState">
    --
  </strong>

  <br>

  TARGET:
  <strong id="targetState">
    NONE
  </strong>

  <br>

  SENSOR:
  <strong id="sensorFPS">
    0
  </strong>
  Hz

</div>


<button id="recenter">
  RECENTER
</button>


<!-- START -->

<div id="start">

  <div class="start-title">
    CHILI
  </div>

  <div class="start-sub">
    VISION GLASSES HUD
  </div>

  <button id="enable">
    ENABLE HEAD CONTROL
  </button>

  <div id="startMessage">
    Look straight ahead when enabling.
  </div>

</div>


<script>

/* =====================================================
   CHILI VISION
   RAY-BAN HEAD CONTROL HUD

   Built from our known-working
   DeviceOrientation implementation.
===================================================== */


/* =========================
   ELEMENTS
========================= */

const pointer =
  document.getElementById("pointer");

const start =
  document.getElementById("start");

const status =
  document.getElementById("status");

const messageBox =
  document.getElementById("messageBox");

const headState =
  document.getElementById("headState");

const targetState =
  document.getElementById("targetState");

const sensorFPSElement =
  document.getElementById("sensorFPS");


const hudButtons =
  Array.from(
    document.querySelectorAll(
      ".hud-button"
    )
  );


/* =========================
   SENSOR STATE
========================= */

let eventCount = 0;

let fpsEvents = 0;

let lastFPSCheck =
  performance.now();


let currentAlpha = null;
let currentBeta = null;
let currentGamma = null;


let baselineAlpha = null;
let baselineBeta = null;
let baselineGamma = null;


let smoothX = 0;
let smoothY = 0;


/* =========================
   INTERACTION STATE
========================= */

let activeTarget = null;

let dwellStart = 0;

const dwellRequired =
  1100;

let targetLocked = false;


/* =========================
   ANGLE
========================= */

function angleDifference(
  current,
  baseline
) {

  let difference =
    current - baseline;


  while (
    difference > 180
  ) {

    difference -= 360;
  }


  while (
    difference < -180
  ) {

    difference += 360;
  }


  return difference;
}


/* =========================
   SENSOR EVENT
========================= */

function handleOrientation(event) {

  eventCount++;
  fpsEvents++;


  const alpha =
    event.alpha;

  const beta =
    event.beta;

  const gamma =
    event.gamma;


  currentAlpha = alpha;
  currentBeta = beta;
  currentGamma = gamma;


  if (
    alpha == null &&
    beta == null &&
    gamma == null
  ) {

    status.textContent =
      "NO SENSOR VALUES";

    return;
  }


  status.textContent =
    "HEAD ONLINE";

  headState.textContent =
    "TRACKING";


  if (
    baselineAlpha === null
  ) {

    baselineAlpha =
      alpha || 0;

    baselineBeta =
      beta || 0;

    baselineGamma =
      gamma || 0;
  }


  const yaw =
    alpha == null
      ? 0
      : angleDifference(
          alpha,
          baselineAlpha
        );


  const pitch =
    beta == null
      ? 0
      : beta - baselineBeta;


  /*
    Same horizontal behavior that
    already worked on the glasses.
  */

  const desiredX =
    yaw * 7;


  /*
    IMPORTANT:

    Your physical test showed:

    LOOK UP   -> pointer DOWN
    LOOK DOWN -> pointer UP

    We keep the proven behavior here
    for the first interactive build.

    We can invert this later depending
    on the HUD mode we want.
  */

  const desiredY =
    pitch * 7;


  smoothX +=
    (desiredX - smoothX) *
    0.15;


  smoothY +=
    (desiredY - smoothY) *
    0.15;


  const maxX =
    window.innerWidth *
    0.44;


  const maxY =
    window.innerHeight *
    0.40;


  smoothX =
    Math.max(
      -maxX,
      Math.min(
        maxX,
        smoothX
      )
    );


  smoothY =
    Math.max(
      -maxY,
      Math.min(
        maxY,
        smoothY
      )
    );


  pointer.style.transform =
    `translate(
      ${smoothX}px,
      ${smoothY}px
    )`;
}


/* =========================
   POINTER POSITION
========================= */

function getPointerCenter() {

  const rect =
    pointer.getBoundingClientRect();


  return {

    x:
      rect.left +
      rect.width / 2,

    y:
      rect.top +
      rect.height / 2

  };
}


/* =========================
   TARGET DETECTION
========================= */

function findTarget() {

  const p =
    getPointerCenter();


  for (
    const button
    of hudButtons
  ) {

    const rect =
      button.getBoundingClientRect();


    /*
      Slightly enlarged hitbox makes
      head selection easier.
    */

    const padding =
      12;


    if (
      p.x >= rect.left - padding &&
      p.x <= rect.right + padding &&
      p.y >= rect.top - padding &&
      p.y <= rect.bottom + padding
    ) {

      return button;
    }
  }


  return null;
}


/* =========================
   RESET BUTTON
========================= */

function resetTarget(
  button
) {

  if (!button) {
    return;
  }


  button.classList.remove(
    "targeted"
  );


  const fill =
    button.querySelector(
      ".progress-fill"
    );


  if (fill) {

    fill.style.width =
      "0%";
  }
}


/* =========================
   ACTION
========================= */

function activateTarget(
  button
) {

  const action =
    button.dataset.action;


  button.classList.add(
    "activated"
  );


  if (
    action === "scan"
  ) {

    showMessage(
      "SCAN MODE ARMED"
    );
  }


  else if (
    action === "menu"
  ) {

    showMessage(
      "CHILI MENU OPEN"
    );
  }


  else if (
    action === "system"
  ) {

    showMessage(
      "SYSTEM ONLINE // HEAD TRACKING OK"
    );
  }


  else if (
    action === "ai"
  ) {

    showMessage(
      "CHILI AI READY"
    );
  }


  setTimeout(
    () => {

      button.classList.remove(
        "activated"
      );

    },
    500
  );
}


/* =========================
   MESSAGE
========================= */

function showMessage(
  text
) {

  messageBox.textContent =
    text;


  messageBox.classList.add(
    "show"
  );


  setTimeout(
    () => {

      messageBox.classList.remove(
        "show"
      );

    },
    1600
  );
}


/* =========================
   INTERACTION LOOP
========================= */

function interactionLoop() {

  const target =
    findTarget();


  if (
    target !== activeTarget
  ) {

    resetTarget(
      activeTarget
    );


    activeTarget =
      target;


    dwellStart =
      performance.now();


    targetLocked =
      false;
  }


  if (
    activeTarget
  ) {

    activeTarget.classList.add(
      "targeted"
    );


    targetState.textContent =
      activeTarget
        .dataset
        .action
        .toUpperCase();


    const elapsed =
      performance.now() -
      dwellStart;


    const progress =
      Math.min(
        1,
        elapsed /
        dwellRequired
      );


    const fill =
      activeTarget.querySelector(
        ".progress-fill"
      );


    if (fill) {

      fill.style.width =
        `${progress * 100}%`;
    }


    if (
      progress >= 1 &&
      !targetLocked
    ) {

      targetLocked =
        true;


      activateTarget(
        activeTarget
      );
    }

  }

  else {

    targetState.textContent =
      "NONE";
  }


  requestAnimationFrame(
    interactionLoop
  );
}


requestAnimationFrame(
  interactionLoop
);


/* =========================
   SENSOR FPS
========================= */

setInterval(
  () => {

    const now =
      performance.now();


    const elapsed =
      now -
      lastFPSCheck;


    sensorFPSElement.textContent =
      Math.round(
        fpsEvents *
        1000 /
        elapsed
      );


    fpsEvents =
      0;


    lastFPSCheck =
      now;

  },
  1000
);


/* =========================
   RECENTER
========================= */

function recenter() {

  if (
    currentAlpha == null &&
    currentBeta == null &&
    currentGamma == null
  ) {

    return;
  }


  baselineAlpha =
    currentAlpha || 0;

  baselineBeta =
    currentBeta || 0;

  baselineGamma =
    currentGamma || 0;


  smoothX = 0;
  smoothY = 0;


  pointer.style.transform =
    "translate(0px,0px)";


  showMessage(
    "VIEW RECENTERED"
  );
}


/* =========================
   ENABLE
========================= */

async function enableMotion() {

  try {

    /*
      Same permission approach as
      our successful gyro test.
    */

    if (
      typeof DeviceOrientationEvent !==
        "undefined" &&

      typeof DeviceOrientationEvent
        .requestPermission ===
        "function"
    ) {

      const permission =
        await DeviceOrientationEvent
          .requestPermission();


      if (
        permission !==
        "granted"
      ) {

        throw new Error(
          "Motion permission denied."
        );
      }
    }


    window.addEventListener(
      "deviceorientation",
      handleOrientation,
      true
    );


    start.style.display =
      "none";


    status.textContent =
      "LISTENING";


    setTimeout(
      () => {

        if (
          eventCount === 0
        ) {

          status.textContent =
            "NO SENSOR EVENTS";
        }

      },
      3000
    );

  }

  catch(error) {

    console.error(error);

    document
      .getElementById(
        "startMessage"
      )
      .textContent =
        "ERROR: " +
        error.message;
  }
}


/* =========================
   BUTTONS
========================= */

document
  .getElementById(
    "enable"
  )
  .addEventListener(
    "click",
    enableMotion
  );


document
  .getElementById(
    "recenter"
  )
  .addEventListener(
    "click",
    recenter
  );

</script>

</body>
</html>
