<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   user-scalable=no">

    <title>Chili Vision V3</title>

    <link rel="stylesheet" href="style.css">

    <!-- TensorFlow -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <!-- Object detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <!-- Face detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
</head>

<body>

<div id="app">

    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="vision"></canvas>

    <div id="topHUD">

        <div>
            <div class="logo">
                🌶 CHILI VISION
            </div>

            <div class="sub">
                INDUSTRIAL VISION SYSTEM // V3
            </div>
        </div>

        <div id="status">
            BOOTING...
        </div>

    </div>


    <div id="modePanel">

        <div>
            MODE
            <strong id="mode">
                WORK
            </strong>
        </div>

        <div>
            OBJECTS
            <strong id="objects">
                0
            </strong>
        </div>

        <div>
            FACES
            <strong id="faces">
                0
            </strong>
        </div>

        <div>
            EVENTS
            <strong id="events">
                0
            </strong>
        </div>

    </div>


    <div id="alertBox">
        SYSTEM NORMAL
    </div>


    <div id="bottomHUD">

        <span id="fps">
            AI FPS: --
        </span>

        <span>
            CHILI CORE ● ONLINE
        </span>

    </div>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
